<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دخول مدير المؤسسة - بوابة المستخلفين والمتعاقدين</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

  <!-- المكتبات الأساسية -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- ملفات المنظومة -->
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/firebase-init.js"></script>
  <script src="../js/geo-data.js"></script>
  <script src="../js/app-core.js"></script>
  <script src="../js/auth-check.js"></script>
  <script src="../js/director-logic.js"></script>

  <style>
    .fa, .fas, .far, .fab, .fa-solid, .fa-regular {
      font-family: "Font Awesome 6 Free", "Font Awesome 5 Free", FontAwesome !important;
      font-style: normal !important;
    }
  </style>
</head>
<body class="bg-gradient-flow">

  <div class="welcome-card" style="max-width: 500px;">
    
    <div class="logo-spinning-wrapper">
      <img src="https://lh3.googleusercontent.com/d/1BqWoqh1T1lArUcwAGNF7cGnnN83niKVl" alt="شعار المديرية" class="spinning-logo-img">
    </div>

    <div style="font-size: 13px; font-weight: 700; color: #555; margin-bottom: 5px;">
      الجمهورية الجزائرية الديمقراطية الشعبية<br>
      وزارة التربية الوطنية - مديرية التربية لولاية توقرت
    </div>

    <h2 class="gradient-title-text" style="font-size: 22px; margin-bottom: 5px;">
      بوابة مدراء المؤسسات التعليمية
    </h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 25px; font-weight: 600;">
      فحص وتسجيل مستخلفي ومتعاقدي المؤسسة
    </p>

    <!-- استمارة إدخال رقم حساب المدير -->
    <div id="directorLoginForm">
      <div class="form-group">
        <label for="directorCcpInput" style="text-align: center;">رقم الحساب البريدي الجاري لمدير المؤسسة (CCP):</label>
        <input type="text" id="directorCcpInput" placeholder="أدخل من 10 إلى 12 رقماً بدون المفتاح" 
               style="text-align: center; font-size: 18px; letter-spacing: 2px; font-weight: bold;"
               maxlength="12" oninput="this.value = this.value.replace(/\D/g, '')">
        <small style="color: #718096; display: block; margin-top: 5px;">
          * يتم التحقق أولاً من تسجيلك الرسمي كموظف دائم بالمديرية (من 10 إلى 12 رقماً)
        </small>
      </div>

      <button class="btn btn-main btn-lg" id="btnDirectorCheck" style="width: 100%; margin-top: 15px;" onclick="handleDirectorLogin()">
        <i class="fas fa-check-circle"></i> التحقق والدخول
      </button>

      <a href="../portals.html" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">
        <i class="fas fa-arrow-right"></i> العودة لفضاء البوابات
      </a>
    </div>

  </div>

  <script>
    // معالجة ضغط Enter في حقل CCP
    document.getElementById("directorCcpInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleDirectorLogin();
    });

    async function handleDirectorLogin() {
      const rawCcp = document.getElementById("directorCcpInput").value.trim();
      const cleanCcp = rawCcp.replace(/\D/g, '');

      if (cleanCcp.length < 10 || cleanCcp.length > 12) {
        Swal.fire({
          icon: 'warning',
          title: 'تنبيه رقم الحساب (CCP)',
          text: `رقم الحساب البريدي الجاري CCP يجب أن يتكون من 10 إلى 12 رقماً (أدخلت ${cleanCcp.length} رقم).`,
          confirmButtonColor: '#2575fc'
        });
        return;
      }

      Swal.fire({
        title: 'جاري فحص هوية المدير...',
        text: 'يتم التحقق في قاعدة بيانات الموظفين الدائمين',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        // 1. البحث في كولكشن employeescompay (للتأكد أنه موظف رسمي دائم)
        const permCheck = await DirectorLogic.findInPermanentEmployees(cleanCcp);

        if (!permCheck.exists) {
          Swal.close();
          Swal.fire({
            icon: 'error',
            title: '❌ غير مصرح بالدخول',
            html: `
              <p style="font-size: 14px; line-height: 1.7; color: #333;">
                رقم الحساب <b>(${cleanCcp})</b> غير مسجل ضمن موظفي القطاع الدائمين بمديرية التربية.<br>
                لا يمكن اعتماد أو تسجيل هذا الحساب كمدير مؤسسة.
              </p>
            `,
            confirmButtonColor: '#dc3545'
          });
          return;
        }

        const permData = permCheck.data;
        const directorName = `${permData.fmn || ''} ${permData.frn || ''}`.trim();

        // 2. التحقق إن كان حسابه مسجلاً مسبقاً في directors_accounts
        const dirCheck = await DirectorLogic.findDirectorAccount(cleanCcp);

        if (dirCheck.exists) {
          // مسجل مسبقاً -> توجيه فوري للوحة التحكم
          Swal.close();
          const directorAccount = dirCheck.data;
          AuthGuard.setDirectorSession(directorAccount);

          Swal.fire({
            icon: 'success',
            title: `مرحباً بك السيد(ة) المدير(ة)`,
            html: `<b style="color: #2575fc; font-size: 16px;">${directorAccount.directorName || directorName}</b><br>مؤسسة: <b>${directorAccount.schoolName || ''}</b>`,
            timer: 1800,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "director-dashboard.html";
          });

        } else {
          // غير مسجل كمدير بعد -> فتح نافذة التأكيد وإكمال البيانات
          Swal.close();
          openDirectorRegistrationModal(cleanCcp, directorName, permData);
        }

      } catch (err) {
        Swal.close();
        console.error("خطأ فحص حساب المدير:", err);
        Swal.fire({
          icon: 'error',
          title: 'خطأ في الاتصال',
          text: 'تعذر الاتصال بقاعدة البيانات، يرجى المحاولة مرة أخرى.',
          confirmButtonColor: '#2575fc'
        });
      }
    }

    // نافذة استكمال تسجيل حساب المدير وتحديد المؤسسة
    function openDirectorRegistrationModal(ccp, fullName, permData) {
      let daairaOptions = '<option value="">-- اختر الدائرة --</option>';
      for (const d in baladiyaMap) {
        daairaOptions += `<option value="${d}">${d}</option>`;
      }

      Swal.fire({
        title: 'تأكيد تسجيل حساب مدير مؤسسة',
        html: `
          <div style="text-align: right; direction: rtl; font-size: 13px;">
            <div style="background: #eef4ff; border: 1px solid #d0e0ff; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
              <strong>رقم الحساب:</strong> ${ccp}<br>
              <strong>الاسم واللقب:</strong> <span style="color:#2575fc; font-weight:800;">${fullName}</span>
            </div>

            <p style="font-weight: 700; margin-bottom: 12px; color: #444;">
              يرجى تحديد المؤسسة التعليمية التي تشرفون على إدارتها:
            </p>

            <div class="form-group">
              <label>الطور التعليمي للمؤسسة:</label>
              <select id="modal_level" class="form-control" onchange="updateModalSchools()">
                <option value="ابتدائي">ابتدائي</option>
                <option value="متوسط">متوسط</option>
                <option value="ثانوي">ثانوي</option>
              </select>
            </div>

            <div class="form-group">
              <label>الدائرة:</label>
              <select id="modal_daaira" onchange="onModalDaairaChange()">
                ${daairaOptions}
              </select>
            </div>

            <div class="form-group">
              <label>البلدية:</label>
              <select id="modal_baladiya" onchange="updateModalSchools()">
                <option value="">-- اختر الدائرة أولاً --</option>
              </select>
            </div>

            <div class="form-group">
              <label>اسم المؤسسة:</label>
              <select id="modal_school">
                <option value="">-- اختر البلدية والطور أولاً --</option>
              </select>
            </div>

            <div class="form-group">
              <label>رقم الهاتف للاتصال والتأكيد:</label>
              <input type="text" id="modal_phone" maxlength="10" placeholder="06XXXXXXXX" dir="ltr"
                     value="${permData.phone || ''}" oninput="this.value = this.value.replace(/\\D/g, '')">
            </div>
          </div>
        `,
        width: '540px',
        showCancelButton: true,
        confirmButtonText: 'تأكيد تسجيل حساب المدير',
        cancelButtonText: 'إلغاء',
        confirmButtonColor: '#28a745',
        cancelButtonColor: '#6c757d',
        allowOutsideClick: false,
        preConfirm: () => {
          const level = document.getElementById("modal_level").value;
          const daaira = document.getElementById("modal_daaira").value;
          const baladiya = document.getElementById("modal_baladiya").value;
          const school = document.getElementById("modal_school").value;
          const phone = document.getElementById("modal_phone").value.trim();

          if (!daaira || !baladiya || !school) {
            Swal.showValidationMessage('يرجى تحديد الدائرة والبلدية والمؤسسة بشكل صحيح');
            return false;
          }
          if (phone.length < 10) {
            Swal.showValidationMessage('يرجى إدخال رقم هاتف مكون من 10 أرقام');
            return false;
          }

          return { level, daaira, baladiya, school, phone };
        }
      }).then(async (result) => {
        if (result.isConfirmed) {
          const v = result.value;
          Swal.fire({ title: 'جاري حفظ الحساب...', didOpen: () => Swal.showLoading() });

          const newDirectorData = {
            ccp: ccp,
            directorName: fullName,
            level: v.level,
            daaira: v.daaira,
            baladiya: v.baladiya,
            schoolName: v.school,
            phone: v.phone,
            nss: permData.ass || '',
            nin: permData.nin || ''
          };

          try {
            await DirectorLogic.registerDirectorAccount(newDirectorData);
            AuthGuard.setDirectorSession(newDirectorData);
            
            Swal.fire({
              icon: 'success',
              title: 'تم تسجيل الحساب بنجاح',
              text: 'مرحباً بك في لوحة تسيير مستخلفي مؤسستكم',
              timer: 1800,
              showConfirmButton: false
            }).then(() => {
              window.location.href = "director-dashboard.html";
            });
          } catch (e) {
            Swal.fire('خطأ', 'فشل حفظ حساب المدير في قاعدة البيانات', 'error');
          }
        }
      });
    }

    // دوال الربط الجغرافي داخل النافذة
    window.onModalDaairaChange = function() {
      const daaira = document.getElementById("modal_daaira").value;
      const baladiyaSelect = document.getElementById("modal_baladiya");
      baladiyaSelect.innerHTML = '<option value="">-- اختر البلدية --</option>';

      if (daaira && baladiyaMap[daaira]) {
        baladiyaMap[daaira].forEach(b => {
          baladiyaSelect.innerHTML += `<option value="${b}">${b}</option>`;
        });
      }
      updateModalSchools();
    };

    window.updateModalSchools = function() {
      const daaira = document.getElementById("modal_daaira")?.value;
      const baladiya = document.getElementById("modal_baladiya")?.value;
      const level = document.getElementById("modal_level")?.value;
      const schoolSelect = document.getElementById("modal_school");
      if (!schoolSelect) return;

      schoolSelect.innerHTML = '<option value="">-- اختر المؤسسة --</option>';
      const schools = getInstitutions(daaira, baladiya, level);

      schools.forEach(s => {
        schoolSelect.innerHTML += `<option value="${s}">${s}</option>`;
      });
    };
  </script>
</body>
</html>
