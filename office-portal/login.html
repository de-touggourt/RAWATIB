<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دخول رؤساء المكاتب ومصلحة الرواتب - مديرية التربية لولاية توقرت</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

  <!-- المكتبات الأساسية -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- ملفات المنظومة -->
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/firebase-init.js"></script>
  <script src="../js/app-core.js"></script>
  <script src="../js/auth-check.js"></script>

  <style>
    .fa, .fas, .far, .fab, .fa-solid, .fa-regular {
      font-family: "Font Awesome 6 Free", "Font Awesome 5 Free", FontAwesome !important;
      font-style: normal !important;
    }
  </style>
</head>
<body class="bg-gradient-flow">

  <div class="welcome-card" style="max-width: 480px;">
    
    <div class="logo-spinning-wrapper">
      <img src="https://lh3.googleusercontent.com/d/1BqWoqh1T1lArUcwAGNF7cGnnN83niKVl" alt="شعار" class="spinning-logo-img">
    </div>

    <div style="font-size: 13px; font-weight: 700; color: #555; margin-bottom: 5px;">
      مديرية التربية لولاية توقرت
    </div>

    <h2 class="gradient-title-text" style="font-size: 22px; margin-bottom: 5px;">
      بوابة رؤساء المكاتب ومصلحة الرواتب
    </h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 25px; font-weight: 600;">
      دراسة مطابقة ملفات المستخلفين والاعتماد المالي
    </p>

    <form onsubmit="event.preventDefault(); handleOfficeLogin();">
      <div class="form-group">
        <label style="text-align: right;">المكتب / المصلحة:</label>
        <select id="office_select" required style="font-size: 14px;">
          <option value="primary">رئيس مكتب التعليم الابتدائي</option>
          <option value="middle">رئيس مكتب التعليم المتوسط</option>
          <option value="secondary">رئيس مكتب التعليم الثانوي</option>
          <option value="payroll">رئيس مصلحة نفقات المستخدمين (الرواتب)</option>
        </select>
      </div>

      <div class="form-group">
        <label style="text-align: right;">اسم المستخدم:</label>
        <input type="text" id="office_username" placeholder="اسم المستخدم" required style="text-align: center;">
      </div>

      <div class="form-group">
        <label style="text-align: right;">كلمة المرور:</label>
        <input type="password" id="office_password" placeholder="••••••••" required style="text-align: center;">
      </div>

      <button type="submit" class="btn btn-main btn-lg" style="width: 100%; margin-top: 15px;">
        <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
      </button>

      <a href="../index.html" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">
        <i class="fas fa-arrow-right"></i> العودة للمدخل الرئيسي
      </a>
    </form>

  </div>

  <script>
    async function handleOfficeLogin() {
      const officeType = document.getElementById("office_select").value;
      const username = document.getElementById("office_username").value.trim();
      const password = document.getElementById("office_password").value.trim();

      if (!username || !password) {
        Swal.fire("تنبيه", "يرجى إدخال اسم المستخدم وكلمة المرور", "warning");
        return;
      }

      Swal.fire({ title: 'جاري التحقق من الصلاحيات...', didOpen: () => Swal.showLoading() });

      try {
        let authorized = false;
        let roleTitle = "";
        let filterLevel = "";

        if (officeType === "primary") {
          roleTitle = "رئيس مكتب التعليم الابتدائي";
          filterLevel = "ابتدائي";
        } else if (officeType === "middle") {
          roleTitle = "رئيس مكتب التعليم المتوسط";
          filterLevel = "متوسط";
        } else if (officeType === "secondary") {
          roleTitle = "رئيس مكتب التعليم الثانوي";
          filterLevel = "ثانوي";
        } else if (officeType === "payroll") {
          roleTitle = "رئيس مصلحة تسيير نفقات المستخدمين (الرواتب)";
          filterLevel = "all";
        }

        // فحص قاعدة البيانات لحسابات المكاتب من config/pass حصراً
        if (window.db) {
          try {
            const snap = await window.db.collection("config").doc("pass").get();
            if (snap.exists) {
              const passData = snap.data();
              for (const [key, val] of Object.entries(passData)) {
                if (String(key).trim().toLowerCase() === username.toLowerCase()) {
                  if (String(val).trim() === password) {
                    authorized = true;
                    break;
                  }
                }
              }
              // فحص كاسم المكتب نفسه (مثال: service_pay, primary, middle...)
              if (!authorized && passData[officeType] && String(passData[officeType]).trim() === password) {
                authorized = true;
              }
            }
          } catch(e) {
            console.error("خطأ قراءة config/pass:", e);
          }
        }

        Swal.close();

        if (authorized) {
          const sessionData = {
            officeType,
            roleTitle,
            filterLevel,
            username,
            loginTime: new Date().toISOString()
          };

          AuthGuard.setOfficeSession(sessionData);

          Swal.fire({
            icon: 'success',
            title: `مرحباً بك`,
            text: roleTitle,
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "office-dashboard.html";
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'خطأ في الدخول',
            text: 'اسم المستخدم أو كلمة المرور غير صحيحة لهذا المكتب.',
            confirmButtonColor: '#dc3545'
          });
        }

      } catch (err) {
        Swal.close();
        Swal.fire("خطأ", "تعذر التحقق من الحساب", "error");
      }
    }
  </script>
</body>
</html>
