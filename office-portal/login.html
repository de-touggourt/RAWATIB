<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دخول رؤساء المكاتب ومصلحة الرواتب - مديرية التربية لولاية توقرت</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

  <!-- المكتبات الأساسية -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- ملفات المنظومة -->
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/firebase-init.js"></script>
  <script src="../js/app-core.js"></script>
  <script src="../js/auth-check.js"></script>

  <style>
    .fa, .fas, .far, .fab, .fa-solid, .fa-regular {
      font-family: "Font Awesome 6 Free", "Font Awesome 5 Free", FontAwesome !important;
      font-style: normal !important;
    }
  </style>
</head>
<body class="bg-gradient-flow">

  <div class="welcome-card" style="max-width: 480px;">
    
    <div class="logo-spinning-wrapper">
      <img src="https://lh3.googleusercontent.com/d/1BqWoqh1T1lArUcwAGNF7cGnnN83niKVl" alt="شعار" class="spinning-logo-img">
    </div>

    <div style="font-size: 13px; font-weight: 700; color: #555; margin-bottom: 5px;">
      مديرية التربية لولاية توقرت
    </div>

    <h2 class="gradient-title-text" style="font-size: 22px; margin-bottom: 5px;">
      بوابة رؤساء المكاتب ومصلحة الرواتب
    </h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 25px; font-weight: 600;">
      دراسة مطابقة ملفات المستخلفين والاعتماد المالي
    </p>

    <form onsubmit="event.preventDefault(); handleOfficeLogin();">
      <div class="form-group">
        <label style="text-align: right;">المكتب / المصلحة:</label>
        <select id="office_select" onchange="syncOfficeToUsername()" style="font-size: 14px; font-weight: 700;">
          <option value="primary">رئيس مكتب التعليم الابتدائي (acc_pr)</option>
          <option value="middle">رئيس مكتب التعليم المتوسط (acc_cm)</option>
          <option value="secondary">رئيس مكتب التعليم الثانوي (acc_ly)</option>
          <option value="payroll">رئيس مصلحة نفقات المستخدمين (admin)</option>
        </select>
      </div>

      <div class="form-group">
        <label style="text-align: right;">اسم المستخدم:</label>
        <input type="text" id="office_username" placeholder="acc_pr" oninput="syncUsernameToOffice()" required style="text-align: center; font-weight: bold;">
      </div>

      <div class="form-group">
        <label style="text-align: right;">كلمة المرور:</label>
        <input type="password" id="office_password" placeholder="••••••••" required style="text-align: center;">
      </div>

      <button type="submit" class="btn btn-main btn-lg" style="width: 100%; margin-top: 15px;">
        <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
      </button>

      <a href="../index.html" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">
        <i class="fas fa-arrow-right"></i> العودة للمدخل الرئيسي
      </a>
    </form>

  </div>

  <script>
    // مزامنة اختيار المكتب مع حقل اسم المستخدم
    function syncOfficeToUsername() {
      const officeType = document.getElementById("office_select").value;
      const uInput = document.getElementById("office_username");
      if (officeType === "primary") {
        uInput.value = "acc_pr";
      } else if (officeType === "middle") {
        uInput.value = "acc_cm";
      } else if (officeType === "secondary") {
        uInput.value = "acc_ly";
      } else if (officeType === "payroll") {
        uInput.value = "admin";
      }
    }

    // مزامنة كتابة اسم المستخدم مع القائمة المنسدلة للمكاتب
    function syncUsernameToOffice() {
      const u = document.getElementById("office_username").value.trim().toLowerCase();
      const sel = document.getElementById("office_select");
      if (u === "acc_pr" || u.includes("primaire") || u.includes("ابتدائي")) {
        sel.value = "primary";
      } else if (u === "acc_cm" || u.includes("cem") || u.includes("متوسط")) {
        sel.value = "middle";
      } else if (u === "acc_ly" || u.includes("lycee") || u.includes("ثانوي")) {
        sel.value = "secondary";
      } else if (u === "admin" || u.includes("pay") || u.includes("رواتب")) {
        sel.value = "payroll";
      }
    }

    // التهيئة التلقائية
    document.addEventListener("DOMContentLoaded", () => {
      syncOfficeToUsername();
    });

    async function handleOfficeLogin() {
      const username = document.getElementById("office_username").value.trim();
      const password = document.getElementById("office_password").value.trim();

      if (!username || !password) {
        Swal.fire("تنبيه", "يرجى إدخال اسم المستخدم وكلمة المرور", "warning");
        return;
      }

      Swal.fire({
        title: 'جاري التحقق من الصلاحيات...',
        text: 'يتم فحص بيانات الاعتماد في config/pass',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        const check = await AppCore.ConfigAuth.verifyAdminLogin(username, password);

        Swal.close();

        if (check.success) {
          let officeType = check.officeType || "primary";
          let roleTitle = check.title || "رئيس المكتب";
          let filterLevel = check.filterLevel || "all";

          if (check.role === "office_primary") {
            officeType = "primary";
            filterLevel = "ابتدائي";
            roleTitle = "رئيس مكتب التعليم الابتدائي";
          } else if (check.role === "office_middle") {
            officeType = "middle";
            filterLevel = "متوسط";
            roleTitle = "رئيس مكتب التعليم المتوسط";
          } else if (check.role === "office_secondary") {
            officeType = "secondary";
            filterLevel = "ثانوي";
            roleTitle = "رئيس مكتب التعليم الثانوي";
          } else if (check.role === "office_payroll" || check.role === "admin" || check.isSuperAdmin) {
            officeType = "payroll";
            filterLevel = "all";
            roleTitle = "رئيس مصلحة تسيير نفقات المستخدمين (الرواتب)";
          }

          // تنظيف أي جلسة إدارة سابقة
          AuthGuard.setAdminSession(false);

          // حفظ جلسة المكتب المعني بدقة
          AuthGuard.setOfficeSession({
            officeType: officeType,
            roleTitle: roleTitle,
            filterLevel: filterLevel,
            username: check.username,
            loginTime: new Date().toISOString()
          });

          Swal.fire({
            icon: 'success',
            title: `مرحباً بك`,
            text: roleTitle,
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "office-dashboard.html";
          });

        } else {
          Swal.fire({
            icon: 'error',
            title: 'خطأ في الدخول',
            text: check.message || 'اسم المستخدم أو كلمة المرور غير صحيحة.',
            confirmButtonColor: '#dc3545'
          });
        }

      } catch (err) {
        Swal.close();
        console.error("خطأ فحص حساب المكتب:", err);
        Swal.fire("خطأ", "تعذر التحقق من الحساب، يرجى مراجعة الاتصال بقاعدة البيانات.", "error");
      }
    }
  </script>
</body>
</html>
