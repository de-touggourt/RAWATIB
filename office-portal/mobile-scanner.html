<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الماسح الضوئي الذكي بالهاتف - مديرية التربية لولاية توقرت</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

  <!-- المكتبات الأساسية وقارئ الكاميرا -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- ملفات المنظومة -->
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/firebase-init.js"></script>
  <script src="../js/workflow.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mobile-card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .reader-box {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      margin: 12px 0;
      border: 2px dashed #3b82f6;
      background: #000;
      min-height: 260px;
      position: relative;
    }
    .device-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #0369a1;
      color: white;
      border-radius: 50px;
      font-weight: 800;
      font-size: 12.5px;
      margin-bottom: 8px;
    }
    .result-box {
      background: #0f172a;
      border: 1.5px solid #22c55e;
      border-radius: 14px;
      padding: 14px;
      margin-top: 15px;
      text-align: right;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="mobile-card">
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">
      <img src="https://lh3.googleusercontent.com/d/1BqWoqh1T1lArUcwAGNF7cGnnN83niKVl" alt="شعار" style="width: 42px; height: 42px; border-radius: 50%; border: 2px solid #3b82f6;">
      <div style="text-align: right;">
        <h2 style="font-size: 16.5px; margin: 0; font-weight: 800; color: #60a5fa;">الماسح الضوئي الذكي</h2>
        <span style="font-size: 11px; color: #94a3b8;" id="scannerSubtitle">مديرية التربية لولاية توقرت</span>
      </div>
    </div>

    <!-- مؤشر حالة الجهاز المتصل المسموح به فقط -->
    <div id="sessionStatusContainer">
      <div class="device-status-badge" id="deviceStatusBadge">
        <i class="fas fa-mobile-screen"></i> <span id="deviceInfoLabel">جهاز معتمد متصل</span>
      </div>
    </div>

    <!-- نافذة الكاميرا -->
    <div id="cameraPreview" class="reader-box"></div>

    <div style="display: flex; gap: 8px; justify-content: center; margin-top: 8px;">
      <button class="btn btn-main btn-sm" id="btnRestartCamera" onclick="restartCameraManual()">
        <i class="fas fa-camera"></i> إعادة تشغيل الكاميرا
      </button>
      <button class="btn btn-secondary btn-sm" onclick="toggleTorch()">
        <i class="fas fa-lightbulb"></i> الفلاش
      </button>
    </div>

    <!-- إدخال يدوي احتياطي بالهاتف -->
    <div style="margin-top: 14px; border-top: 1px solid #334155; padding-top: 12px;">
      <input type="text" id="manualCcpInput" placeholder="أو أدخل رقم الحساب CCP يدوياً..." 
             style="width: 100%; height: 40px; text-align: center; font-size: 15px; font-weight: bold; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white;"
             maxlength="12" oninput="this.value = this.value.replace(/\D/g, '')">
      <button class="btn btn-success btn-sm" style="width: 100%; margin-top: 6px; font-weight: 800;" onclick="submitManualScan()">
        <i class="fas fa-check"></i> تأكيد استلام الملف يدوياً
      </button>
    </div>

    <!-- صندوق النتيجة السريعة -->
    <div class="result-box" id="resultCard">
      <div style="color: #4ade80; font-weight: 800; font-size: 14px; margin-bottom: 6px;">
        <i class="fas fa-circle-check"></i> تم استلام الملف بنجاح!
      </div>
      <div style="font-size: 13px; color: #e2e8f0; line-height: 1.7;" id="resultDetails"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get("session") || "default_session";
    const officeType = urlParams.get("office") || "office";
    const scannerUser = decodeURIComponent(urlParams.get("user") || "مسؤول المكتب");

    const myDeviceId = localStorage.getItem("mobile_scanner_dev_id") || ("dev_" + Math.random().toString(36).substring(2, 10));
    localStorage.setItem("mobile_scanner_dev_id", myDeviceId);

    let html5QrCode = null;
    let isCameraRunning = false;
    let isSystemBlocked = false;
    let isProcessingScan = false;
    let audioChime = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
    let torchEnabled = false;

    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById("scannerSubtitle").textContent = `جلسة: ${scannerUser} (${officeType})`;

      // 1. مراقبة حالة الجلسة وصلاحيتها الحية
      if (window.db) {
        window.db.collection("remote_scanner_sessions").doc(sessionId).onSnapshot(async (doc) => {
          if (!doc.exists) {
            await blockScanner("هذه الجلسة غير موجودة أو تم إبطالها من لوحة التحكم.");
            return;
          }

          const sessionData = doc.data();

          // التحقق من فتح/غلق المسح (نظام الغلق والفتح الفوري)
          if (sessionData.is_enabled === false) {
            await blockScanner("نظام المسح بالهاتف مقفل حالياً من لوحة التحكم.");
            return;
          }

          // التحقق من عدد الأجهزة المتصلة المسموح بها فقط
          const maxAllowedDevices = sessionData.max_devices || 1;
          const connected = sessionData.connected_devices || {};
          const isKnownDevice = Boolean(connected[myDeviceId]);

          if (!isKnownDevice && Object.keys(connected).length >= maxAllowedDevices) {
            await blockScanner(`تم الوصول للحد الأقصى للأجهزة المتصلة المسموح بها (${maxAllowedDevices} جهاز). يرجى مراجعة المسؤول للسماح بجهاز إضافي.`);
            return;
          }

          // تسجيل الجهاز في الجلسة إن لم يكن مسجلاً
          if (!isKnownDevice) {
            window.db.collection("remote_scanner_sessions").doc(sessionId).update({
              [`connected_devices.${myDeviceId}`]: {
                joined_at: new Date().toISOString(),
                ua: navigator.userAgent || "الهاتف الذكي"
              }
            }).catch(console.warn);
          }

          document.getElementById("deviceInfoLabel").textContent = `جهاز معتمد (${Object.keys(connected).length || 1} من ${maxAllowedDevices})`;

          // إعادة فتح الكاميرا فورياً إن كانت مغلقة
          await unblockScanner();
        });
      }

      startCamera();
    });

    async function blockScanner(msg) {
      isSystemBlocked = true;
      if (html5QrCode && isCameraRunning) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {
          console.warn("Stop error:", e);
        }
        isCameraRunning = false;
      }

      document.getElementById("cameraPreview").innerHTML = `
        <div style="padding: 50px 15px; color: #f87171; font-weight: 800; font-size: 14px;">
          <i class="fas fa-lock fa-3x" style="margin-bottom: 12px; display:block; color:#ef4444;"></i>
          ${msg}
        </div>
      `;
    }

    async function unblockScanner() {
      if (isSystemBlocked) {
        isSystemBlocked = false;
        await startCamera();
      }
    }

    async function startCamera() {
      if (isSystemBlocked) return;
      if (isCameraRunning) return;

      document.getElementById("cameraPreview").innerHTML = "";

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("cameraPreview");
        }

        const config = { fps: 15, qrbox: { width: 250, height: 200 } };

        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText) => onScanSuccess(decodedText),
          (error) => {}
        );

        isCameraRunning = true;

      } catch (err) {
        console.warn("خطأ تشغيل الكاميرا:", err);
        isCameraRunning = false;
      }
    }

    async function restartCameraManual() {
      if (isSystemBlocked) {
        return Swal.fire("تنبيه", "نظام المسح مقفل حالياً من لوحة التحكم.", "warning");
      }
      if (html5QrCode && isCameraRunning) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch(e) {}
        isCameraRunning = false;
      }
      html5QrCode = null;
      await startCamera();
    }

    async function toggleTorch() {
      if (!isCameraRunning || !html5QrCode) return;
      try {
        torchEnabled = !torchEnabled;
        await html5QrCode.applyVideoConstraints({
          advanced: [{ torch: torchEnabled }]
        });
      } catch (e) {
        Swal.fire({ toast: true, position: 'bottom', title: 'الفلاش غير مدعوم على هذا الجهاز', timer: 1500, showConfirmButton: false });
      }
    }


    async function onScanSuccess(decodedText) {
      if (isSystemBlocked || isProcessingScan) return;
      isProcessingScan = true;

      try {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        audioChime.play().catch(() => {});
      } catch(e) {}

      await showScannedEmployeeModal(decodedText);

      setTimeout(() => {
        isProcessingScan = false;
      }, 1000);
    }

    async function showScannedEmployeeModal(code) {
      // التحقق اللحظي من فتح المسح قبل المعالجة
      if (window.db) {
        try {
          const freshSnap = await window.db.collection("remote_scanner_sessions").doc(sessionId).get();
          if (!freshSnap.exists || freshSnap.data().is_enabled === false) {
            return Swal.fire("ممنوع", "تم قفل نظام المسح بالهاتف من لوحة التحكم.", "warning");
          }
        } catch(e) {}
      }

      Swal.fire({
        title: 'جاري البحث عن الملف...',
        didOpen: () => Swal.showLoading(),
        allowOutsideClick: false
      });

      try {
        const foundRes = await findRegistrationByCode(code);
        Swal.close();

        if (!foundRes.found) {
          return Swal.fire({
            icon: 'warning',
            title: 'لم يتم العثور على الملف',
            text: foundRes.message || `لم يتم العثور على أي ملف مسجل برقم أو رمز (${code}).`,
            confirmButtonText: 'حسناً',
            confirmButtonColor: '#3b82f6'
          });
        }

        const emp = foundRes.data;
        const empId = foundRes.docId;
        const stInfo = getStatusInfo(emp.workflow_status);
        const nameAr = `${emp.fmn_ar || ''} ${emp.frn_ar || ''}`.trim();
        const isPayroll = officeType === "payroll";

        const { value: chosenAction } = await Swal.fire({
          title: `ملف الموظف: ${nameAr}`,
          html: `
            <div style="direction: rtl; text-align: right; font-size: 13.5px; line-height: 1.8;">
              <div style="background: #1e293b; color: #f8fafc; border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155;">
                <div style="margin-bottom: 5px;"><b>رقم الحساب (CCP):</b> <span style="color:#60a5fa; font-weight:bold;">${emp.ccp}</span></div>
                <div style="margin-bottom: 5px;"><b>رقم التعريف (NIN):</b> <span style="font-family:monospace;">${emp.nin || '---'}</span></div>
                <div style="margin-bottom: 5px;"><b>المؤسسة:</b> <span>${emp.school_name || '---'}</span> (${emp.level || '---'})</div>
                <div style="margin-bottom: 5px;"><b>الرتبة والصفة:</b> <span>${emp.rank || '---'}</span> - <b>${emp.status_type || '---'}</b></div>
                <div style="margin-bottom: 5px;"><b>فترة العمل:</b> من ${emp.start_date || '---'} إلى ${emp.end_date || '---'} (${emp.duration_days || 0} يوم)</div>
                <div><b>الوضعية الحالية:</b> <span style="color:${stInfo.color}; font-weight:800;"><i class="fas ${stInfo.icon}"></i> ${stInfo.label}</span></div>
                ${emp.decision_number ? `<div style="color:#4ade80; font-weight:bold; margin-top:5px;"><i class="fas fa-certificate"></i> رقم المقرر: ${emp.decision_number}</div>` : ''}
              </div>
              <div style="color: #64748b; font-size: 12px; text-align: center;">
                اختر الإجراء المطلوب تنفيذه على هذا الملف فورياً:
              </div>
            </div>
          `,
          showCancelButton: true,
          showDenyButton: true,
          confirmButtonText: isPayroll ? '<i class="fas fa-check"></i> مستلم بالمصلحة' : '<i class="fas fa-inbox"></i> مستلم بالمكتب',
          denyButtonText: '<i class="fas fa-clipboard-check"></i> دراسة الملف',
          cancelButtonText: '<i class="fas fa-times"></i> إغلاق',
          confirmButtonColor: '#10b981',
          denyButtonColor: '#2563eb',
          cancelButtonColor: '#64748b',
          allowOutsideClick: false
        });

        if (chosenAction === true) {
          // 1. إجراء مستلم بالمكتب
          await executeMobileReceive(empId, emp);
        } else if (chosenAction === false && Swal.getDenyButton() && document.activeElement === Swal.getDenyButton()) {
          // 2. إجراء دراسة الملف
          await executeMobileStudy(empId, emp);
        }
        // في حالة إلغاء/إغلاق: تعود الكاميرا للعمل تلقائياً

      } catch (err) {
        Swal.close();
        console.error("خطأ معالجة مسح الهاتف:", err);
        Swal.fire('خطأ', 'حدث خطأ أثناء الاتصال بقاعدة البيانات: ' + err.message, 'error');
      }
    }

    // تنفيذ إجراء الاستلام المباشر بالمكتب
    async function executeMobileReceive(empId, emp) {
      Swal.fire({ title: 'جاري تسجيل الاستلام...', didOpen: () => Swal.showLoading() });
      try {
        const res = await receiveFileByScan(empId, scannerUser, `ماسح الهاتف (${officeType})`, officeType);
        Swal.close();

        if (res.success) {
          if (window.db) {
            await window.db.collection("remote_scanner_sessions").doc(sessionId).update({
              last_scanned_doc: res.docId,
              last_scanned_data: res.data,
              last_scanned_at: new Date().toISOString()
            });
          }

          Swal.fire({
            icon: 'success',
            title: 'تم استلام الملف بنجاح!',
            html: `تم تسجيل استلام ملف <b>${emp.fmn_ar || ''} ${emp.frn_ar || ''}</b> وتجميد تعديله للمؤسسة.`,
            timer: 2000,
            showConfirmButton: false
          });

          // عرض كرت النتيجة
          const box = document.getElementById("resultCard");
          box.style.display = "block";
          document.getElementById("resultDetails").innerHTML = `
            <b>الاسم:</b> ${emp.fmn_ar || ''} ${emp.frn_ar || ''}<br>
            <b>رقم CCP:</b> ${emp.ccp}<br>
            <b>المؤسسة:</b> ${emp.school_name}<br>
            <b>الحالة الجديدة:</b> <span style="color:#4ade80; font-weight:800;">مستلم بالمكتب</span>
          `;
        } else {
          Swal.fire('تنبيه', res.message, 'warning');
        }
      } catch(err) {
        Swal.fire('خطأ', 'فشل الاستلام: ' + err.message, 'error');
      }
    }

    // تنفيذ إجراء دراسة الملف بالهاتف
    async function executeMobileStudy(empId, emp) {
      const isPayroll = officeType === "payroll";
      const { value: studyData } = await Swal.fire({
        title: `دراسة ملف: ${emp.fmn_ar || ''} ${emp.frn_ar || ''}`,
        html: `
          <div style="direction: rtl; text-align: right; font-size: 13px;">
            <div style="margin-bottom: 10px;">
              <label style="font-weight: 700; display: block; margin-bottom: 3px;">رقم المقرر الصادر:</label>
              <input type="text" id="m_dec_num" value="${emp.decision_number || ''}" placeholder="مثال: 145 أو 352/2026" 
                     style="width: 100%; height: 38px; border: 1.5px solid #3b82f6; border-radius: 8px; text-align: center; font-weight: bold; background:#0f172a; color:white;">
            </div>
            <div style="margin-bottom: 10px;">
              <label style="font-weight: 700; display: block; margin-bottom: 3px;">تاريخ صدور المقرر:</label>
              <input type="date" id="m_dec_date" value="${emp.decision_date || new Date().toISOString().slice(0, 10)}" 
                     style="width: 100%; height: 38px; border: 1.5px solid #3b82f6; border-radius: 8px; text-align: center; background:#0f172a; color:white;">
            </div>
            <div style="margin-bottom: 10px;">
              <label style="font-weight: 700; display: block; margin-bottom: 3px;">القرار والتأشيرة:</label>
              <select id="m_action_choice" style="width: 100%; height: 38px; border-radius: 8px; font-weight: bold; background:#0f172a; color:white; border: 1.5px solid #3b82f6;">
                <option value="approved">${isPayroll ? 'اعتماد نهائي للصرف والرواتب' : 'مطابق - إحالة لمصلحة الرواتب'}</option>
                <option value="received">مستلم بالمكتب (قيد الدراسة)</option>
                <option value="returned">غير مطابق - إرجاع للمؤسسة للتعديل</option>
              </select>
            </div>
            <div style="margin-bottom: 10px;">
              <label style="font-weight: 700; display: block; margin-bottom: 3px;">ملاحظات الدراسة (إلزامية عند الإرجاع):</label>
              <textarea id="m_note" placeholder="اكتب ملاحظة التعديل أو الاعتماد..." 
                        style="width: 100%; height: 60px; border-radius: 8px; border: 1px solid #475569; background:#0f172a; color:white;"></textarea>
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: 'حفظ وتأكيد',
        cancelButtonText: 'إلغاء',
        confirmButtonColor: '#10b981',
        preConfirm: () => {
          return {
            decNum: document.getElementById("m_dec_num").value.trim(),
            decDate: document.getElementById("m_dec_date").value,
            actionChoice: document.getElementById("m_action_choice").value,
            note: document.getElementById("m_note").value.trim()
          };
        }
      });

      if (!studyData) return;

      if (studyData.actionChoice === "returned" && !studyData.note) {
        return Swal.fire("تنبيه", "يجب كتابة سبب الإرجاع لتوضيحه للمؤسسة.", "warning");
      }

      Swal.fire({ title: 'جاري تحديث الملف...', didOpen: () => Swal.showLoading() });

      try {
        let newStatus = "submitted_to_office";
        let defaultNote = "تم تحديث الملف بالدراسة عبر الماسح";
        let extra = {};

        if (studyData.actionChoice === "approved") {
          newStatus = isPayroll ? "payroll_approved" : "office_approved";
          defaultNote = isPayroll ? "تم التدقيق والاعتماد النهائي للصرف والرواتب" : "مطابق قانونياً ومحال لمصلحة الرواتب";
        } else if (studyData.actionChoice === "returned") {
          newStatus = isPayroll ? "payroll_rejected" : "returned_to_director";
          defaultNote = studyData.note;
          extra.allow_director_edit = true; // السماح للمدير بالتعديل
        }

        if (studyData.decNum) {
          extra.decision_number = studyData.decNum;
          extra.decision_date = studyData.decDate;
          extra.is_decision_published = true;
        }

        await updateFileStatus(
          empId, 
          newStatus, 
          scannerUser, 
          `ماسح الهاتف (${officeType})`, 
          studyData.note || defaultNote,
          extra
        );

        // تزامن مع الجلسة
        if (window.db) {
          await window.db.collection("remote_scanner_sessions").doc(sessionId).update({
            last_scanned_doc: empId,
            last_scanned_at: new Date().toISOString()
          });
        }

        Swal.fire('تم بنجاح', 'تم تسجيل نتيجة دراسة الملف بنجاح.', 'success');
      } catch(err) {
        Swal.fire('خطأ', 'فشل حفظ نتيجة الدراسة: ' + err.message, 'error');
      }
    }

    async function submitManualScan() {
      const ccp = document.getElementById("manualCcpInput").value.trim();
      if (!ccp) return;
      await showScannedEmployeeModal(ccp);
      document.getElementById("manualCcpInput").value = "";
    }
  </script>
</body>
</html>
