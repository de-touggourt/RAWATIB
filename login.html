<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - المنظومة الرقمية لمديرية التربية لولاية توقرت</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

  <!-- المكتبات الأساسية -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- ملفات المنظومة -->
  <link rel="stylesheet" href="css/main.css">
  <script src="js/firebase-init.js"></script>
  <script src="js/app-core.js"></script>
  <script src="js/auth-check.js"></script>
  <script src="js/director-logic.js"></script>

  <style>
    .fa, .fas, .far, .fab, .fa-solid, .fa-regular {
      font-family: "Font Awesome 6 Free", "Font Awesome 5 Free", FontAwesome !important;
      font-style: normal !important;
    }
    body {
      background: linear-gradient(135deg, #0b1329 0%, #1e3a8a 50%, #1d4ed8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
      font-family: 'Cairo', sans-serif !important;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 15% 25%, rgba(59, 130, 246, 0.25) 0%, transparent 45%),
                  radial-gradient(circle at 85% 75%, rgba(245, 158, 11, 0.2) 0%, transparent 45%);
      pointer-events: none;
    }

    .login-container-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(18px);
      border-radius: 26px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.9);
      position: relative;
      z-index: 10;
      animation: fadeInScale 0.35s ease-out;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .login-header-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo-circle {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 3px solid #2563eb;
      object-fit: cover;
      margin: 0 auto 14px auto;
      display: block;
      box-shadow: 0 6px 20px rgba(37,99,235,0.3);
      transition: transform 0.3s ease;
    }
    .login-logo-circle:hover {
      transform: scale(1.05) rotate(4deg);
    }

    .login-header-section h2 {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      margin: 0 0 5px 0;
    }

    .login-header-section p {
      font-size: 13px;
      color: #64748b;
      margin: 0;
      font-weight: 600;
    }

    .form-group-custom {
      margin-bottom: 20px;
      text-align: right;
    }

    .form-group-custom label {
      display: block;
      margin-bottom: 7px;
      font-size: 13.5px;
      font-weight: 700;
      color: #334155;
    }

    .input-wrapper-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper-icon i.field-icon {
      position: absolute;
      right: 14px;
      color: #94a3b8;
      font-size: 16px;
      pointer-events: none;
    }

    .custom-input {
      width: 100%;
      height: 50px;
      padding: 10px 44px 10px 44px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      background: #f8fafc;
      transition: all 0.25s ease;
      box-sizing: border-box;
      outline: none;
    }

    .custom-input:focus {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .toggle-password-btn {
      position: absolute;
      left: 14px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 17px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .toggle-password-btn:hover {
      color: #2563eb;
    }

    .btn-submit-login {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      width: 100%;
      height: 50px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(37, 99, 235, 0.38);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-submit-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(37, 99, 235, 0.48);
    }
    .btn-submit-login:active {
      transform: scale(0.98);
    }

    .back-to-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 13px;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }
    .back-to-home:hover {
      color: #2563eb;
    }

    .login-helper-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 12.5px;
      color: #1e40af;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .login-container-card {
        padding: 30px 20px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container-card">
    
    <div class="login-header-section">
      <img src="https://lh3.googleusercontent.com/d/1BqWoqh1T1lArUcwAGNF7cGnnN83niKVl" 
           alt="شعار مديرية التربية لولاية توقرت" 
           class="login-logo-circle">
      <h2>تسجيل الدخول للمنظومة</h2>
      <p>مديرية التربية لولاية توقرت - مصلحة تسيير نفقات المستخدمين</p>
    </div>

    <div class="login-helper-box">
      <i class="fas fa-shield-halved"></i> فضاء تسجيل الدخول لمدراء المؤسسات، رؤساء المكاتب ومصلحة الرواتب. يرجى إدخال اسم المستخدم وكلمة المرور الخاصة بحسابكم.
    </div>

    <!-- استمارة الدخول الموحدة بالاسم وكلمة المرور فقط -->
    <form id="unifiedLoginForm" onsubmit="event.preventDefault(); handleSystemLogin();">
      
      <!-- اسم المستخدم -->
      <div class="form-group-custom">
        <label for="usernameInput">اسم المستخدم أو رقم الحساب:</label>
        <div class="input-wrapper-icon">
          <i class="fas fa-user-shield field-icon"></i>
          <input type="text" id="usernameInput" class="custom-input" 
                 placeholder="أدخل اسم المستخدم أو CCP" required autofocus>
        </div>
      </div>

      <!-- كلمة المرور -->
      <div class="form-group-custom">
        <label for="passwordInput">كلمة المرور السرية:</label>
        <div class="input-wrapper-icon">
          <i class="fas fa-lock field-icon"></i>
          <input type="password" id="passwordInput" class="custom-input" 
                 placeholder="••••••••" required>
          <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="إظهار / إخفاء">
            <i class="fas fa-eye" id="passwordToggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit-login" id="btnLoginSubmit">
        <i class="fas fa-arrow-left"></i>
        <span>تسجيل الدخول</span>
      </button>

      <!-- زر العودة للرئيسية -->
      <a href="index.html" class="back-to-home">
        <i class="fas fa-house"></i> العودة للواجهة التعريفية
      </a>

    </form>

  </div>

  <script>
    // إظهار وإخفاء كلمة المرور
    function togglePasswordVisibility() {
      const passInp = document.getElementById("passwordInput");
      const icon = document.getElementById("passwordToggleIcon");
      if (passInp.type === "password") {
        passInp.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        passInp.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    // معالجة تسجيل الدخول الآمن الموحد
    async function handleSystemLogin() {
      const username = document.getElementById("usernameInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();

      if (!username || !password) {
        return Swal.fire({
          icon: 'warning',
          title: 'تنبيه',
          text: 'يرجى إدخال اسم المستخدم وكلمة المرور.',
          confirmButtonColor: '#2563eb'
        });
      }

      Swal.fire({
        title: 'جاري التحقق من الحساب...',
        text: 'يتم فحص الصلاحيات وكلمة المرور',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        // ------------------------------------------------------------
        // 1. الفحص أولاً في حسابات الإدارة والمكاتب من config/pass
        // ------------------------------------------------------------
        const adminCheck = await AppCore.ConfigAuth.verifyAdminLogin(username, password);

        if (adminCheck.success) {
          Swal.close();

          if (adminCheck.role === "office_primary" || adminCheck.role === "office_middle" || adminCheck.role === "office_secondary") {
            AuthGuard.setAdminSession(false);
            AuthGuard.setOfficeSession({
              officeType: adminCheck.officeType || adminCheck.role.replace("office_", ""),
              roleTitle: adminCheck.title,
              filterLevel: adminCheck.filterLevel,
              username: adminCheck.username
            });
            Swal.fire({
              icon: 'success',
              title: 'مرحباً بك',
              text: adminCheck.title,
              timer: 1300,
              showConfirmButton: false
            }).then(() => {
              window.location.href = "office-portal/office-dashboard.html";
            });
            return;
          } else if (adminCheck.role === "office_payroll") {
            AuthGuard.setAdminSession(false);
            AuthGuard.setOfficeSession({
              officeType: "payroll",
              roleTitle: "رئيس مصلحة تسيير نفقات المستخدمين (الرواتب)",
              filterLevel: "all",
              username: adminCheck.username || "رئيس مصلحة الرواتب"
            });
            Swal.fire({
              icon: 'success',
              title: 'مرحباً بك',
              text: 'لوحة مصلحة الرواتب - متابعة واعتماد الملفات',
              timer: 1300,
              showConfirmButton: false
            }).then(() => {
              window.location.href = "office-portal/office-dashboard.html";
            });
            return;
          } else if (adminCheck.role === "director") {
            AuthGuard.setAdminSession(false);
            AuthGuard.setDirectorSession({
              directorName: adminCheck.username,
              ccp: adminCheck.username
            });
            Swal.fire({
              icon: 'success',
              title: 'مرحباً بك',
              text: adminCheck.title,
              timer: 1300,
              showConfirmButton: false
            }).then(() => {
              window.location.href = "contract-portal/director-dashboard.html";
            });
            return;
          } else if (adminCheck.isSuperAdmin || adminCheck.role === "admin") {
            AuthGuard.setAdminSession(true, adminCheck);
            Swal.fire({
              icon: 'success',
              title: 'مرحباً بك',
              text: 'لوحة التحكم المركزية - المشرف العام',
              timer: 1300,
              showConfirmButton: false
            }).then(() => {
              window.location.href = "admin/dashboard.html";
            });
            return;
          }
        }

        // ------------------------------------------------------------
        // 2. الفحص في حسابات المستخدمين والمدراء المنشأة (users_accounts)
        // ------------------------------------------------------------
        const userCheck = await AppCore.Users.verifyUserLogin(username, password);

        if (userCheck.success) {
          Swal.close();
          const user = userCheck.user;
          AuthGuard.setUserSession(user);

          Swal.fire({
            icon: 'success',
            title: `مرحباً بك`,
            html: `<b style="color: #2563eb; font-size: 17px;">${user.first_name || ''} ${user.last_name || ''}</b><br><span style="color:#64748b; font-size:13px;">${user.school_name || ''}</span>`,
            timer: 1400,
            showConfirmButton: false
          }).then(() => {
            if (user.role === "director" || user.school_name) {
              window.location.href = "contract-portal/director-dashboard.html";
            } else {
              window.location.href = "portals.html";
            }
          });
          return;
        }

        // ------------------------------------------------------------
        // 3. الفحص في حسابات المدراء المسجلين (directors_accounts)
        // ------------------------------------------------------------
        const cleanCcp = username.replace(/\D/g, '');
        if (cleanCcp.length >= 10 && cleanCcp.length <= 12) {
          const dirAccount = await DirectorLogic.findDirectorAccount(cleanCcp);
          if (dirAccount.exists) {
            const d = dirAccount.data;
            // فحص كلمة المرور إذا كانت مسجلة أو مطابقة
            if (!d.password || String(d.password) === String(password) || String(password) === cleanCcp.slice(-4)) {
              Swal.close();
              AuthGuard.setDirectorSession({
                ccp: dirAccount.ccp,
                directorName: d.directorName || "السيد المدير",
                schoolName: d.schoolName || "",
                level: d.level || "",
                daaira: d.daaira || "",
                baladiya: d.baladiya || "",
                phone: d.phone || ""
              });
              Swal.fire({
                icon: 'success',
                title: 'مرحباً بك يا سيدي المدير',
                text: d.directorName || d.schoolName,
                timer: 1300,
                showConfirmButton: false
              }).then(() => {
                window.location.href = "contract-portal/director-dashboard.html";
              });
              return;
            }
          }
        }

        // فشل تسجيل الدخول
        Swal.close();
        Swal.fire({
          icon: 'error',
          title: 'فشل تسجيل الدخول',
          text: 'اسم المستخدم أو كلمة المرور غير صحيحة.',
          confirmButtonColor: '#2563eb'
        });

      } catch (err) {
        Swal.close();
        console.error("خطأ تسجيل الدخول:", err);
        Swal.fire('خطأ في الاتصال', 'تعذر الاتصال بقاعدة البيانات، يرجى المحاولة لاحقاً.', 'error');
      }
    }
  </script>

</body>
</html>
