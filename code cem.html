function validateNumber(input) {
  input.value = input.value.replace(/\D/g, '');
  if (input.value.length > 16) input.value = input.value.slice(0, 16);
}

async function checkEmployee() {
  const empId = document.getElementById("empId").value.trim();

  if (empId.length < 16) {
    Swal.fire({ icon: 'warning', title: 'خطأ', text: 'رقم التعريف الوظيفي يجب أن يتكون من 16 رقمًا' });
    return;
  }

  Swal.fire({ title: 'جاري التحقق...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  try {
    const docRef = db.collection("employeescom").doc(empId);
    const docSnap = await docRef.get();

    if (!docSnap.exists) {
      Swal.close();
      Swal.fire("❌ خطأ", "رقم الموظف غير موجود في قاعدة البيانات", "error");
      return;
    }

    const data = docSnap.data();

    // ✅ التحقق من وجود تسجيل سابق قبل عرض الاستمارة
    const params = new URLSearchParams();
    params.append("action", "check_existing");
    params.append("empId", empId);

    try {
      const res = await fetch(scriptURL, {
        method: "POST",
        body: params
      });
      const result = await res.json();

      Swal.close();

      if (result.result === "exists") {
        const d = result.data || {};
        const currentWorkLine = (d.role === "مدير مكلف" && d.currentWork)
          ? `<b>مؤسسة العمل الحالية:</b> ${d.currentWork}<br>` : "";

        Swal.fire({
          title: "⚠️ التسجيل موجود مسبقًا",
          html: `
            <div style="text-align:right;direction:rtl;font-family:'Cairo',sans-serif;">
              <b>رقم التعريف:</b> ${d.empId || ''}<br>
              <b>الاسم واللقب:</b> ${d.name || ''}<br>
              <b>الرتبة:</b> ${d.grade || ''}<br>
              <b>مؤسسة العمل الأصلية:</b> ${d.place || ''}<br>
              <b>الصفة:</b> ${d.role || ''}<br>
              ${currentWorkLine}
              <b>الطور:</b> ${d.level || ''}<br>
              <b>الدائرة:</b> ${d.daira || ''}<br>
              <b>البلدية:</b> ${d.baladiya || ''}<br>
              <b>اسم المؤسسة:</b> ${d.school || ''}<br>
              <b>رمز المؤسسة:</b> ${d.schoolCode || ''}<br>
              <b>البريد الإلكتروني:</b> ${d.email || ''}<br>
              <b>هاتف المدير:</b> <span style="direction:ltr;unicode-bidi:bidi-override;display:inline-block;text-align:left;">${formatPhoneNumber(d.directorPhone || '')}</span><br>
              <b>اسم المسير المالي:</b> ${d.financialName || ''}<br>
              <b>هاتف المسير المالي:</b> <span style="direction:ltr;unicode-bidi:bidi-override;display:inline-block;text-align:left;">${formatPhoneNumber(d.financialPhone || '')}</span><br>
              ${d.institutionFixedPhone ? `<b>رقم الهاتف الثابت للمؤسسة:</b> <span style="direction:ltr;unicode-bidi:bidi-override;display:inline-block;text-align:left;">${formatFixedPhoneNumber(d.institutionFixedPhone || '')}</span><br>` : ''}
              <b>تاريخ التسجيل:</b> <span style="direction:ltr;unicode-bidi:bidi-override;display:inline-block;text-align:left;">${formatDateFromISO(d.date || '')}</span>${d.modificationDate ? `<br><b>تاريخ التعديل:</b> <span style="direction:ltr;unicode-bidi:bidi-override;display:inline-block;text-align:left;">${formatDateFromISO(d.modificationDate || '')}</span>` : ''}
            </div>`,
          icon: "warning",
          showCancelButton: true,
          showDenyButton: true,
          confirmButtonText: "تعديل البيانات",
          denyButtonText: "حذف التسجيل",
          cancelButtonText: "إغلاق",
          confirmButtonColor: "#FFAD29",
          denyButtonColor: "#dc3545"
        }).then((result) => {
          if (result.isConfirmed) {
            // عرض الاستمارة مع البيانات للتعديل
            showEditForm(empId, data, d);
          } else if (result.isDenied) {
            // حذف التسجيل
            deleteRegistration(empId);
          }
        });
        return; // 🟥 لا نعرض الاستمارة إلا عند الضغط على تعديل
      }

      // 🟢 في حالة عدم وجود تسجيل سابق → نسمح بمتابعة التسجيل
      Swal.fire({
        title: "✅ تم التحقق بنجاح",
        html: `<b>الاسم واللقب:</b> ${escapeHtml(data.name)}<br><b>الرتبة:</b> ${escapeHtml(data.grade)}<br><b>مكان العمل:</b> ${escapeHtml(data.place)}`,
        icon: "success",
        confirmButtonText: "متابعة التسجيل"
      }).then(() => showForm(empId, data));

    } catch (err) {
      Swal.close();
      Swal.fire("❌ خطأ", "تعذر التحقق من التسجيلات السابقة", "error");
      console.error("check_existing error:", err);
    }

  } catch (err) {
    Swal.close();
    Swal.fire("❌ خطأ", "حدث خطأ أثناء الاتصال بقاعدة بيانات الموظفين", "error");
    console.error("Firebase error:", err);
  }
}


function escapeHtml(str){ return String(str || '').replace(/[&<>"'`=\/]/g, function(s){ return '&#' + s.charCodeAt(0) + ';'; }); }

// دالة لتحويل التاريخ من صيغة ISO إلى صيغة "dd-MM-yyyy HH:mm:ss"
function formatDateFromISO(dateStr) {
  if (!dateStr) return 'غير محدد';
  
  try {
    let date;
    
    // التحقق إذا كان التاريخ بصيغة ISO (مثل: 2025-11-14T12:17:26.000Z)
    if (dateStr.includes('T')) {
      date = new Date(dateStr);
    } else if (dateStr.includes('-') && dateStr.includes(' ')) {
      // إذا كان بصيغة "dd-MM-yyyy HH:mm:ss" نعيده كما هو
      return dateStr;
    } else {
      // محاولة تحويله كتاريخ
      date = new Date(dateStr);
    }
    
    // التحقق من صحة التاريخ
    if (isNaN(date.getTime())) {
      return dateStr;
    }
    
    // تحويل التاريخ إلى صيغة "dd-MM-yyyy HH:mm:ss"
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    
    return `${hours}:${minutes}:${seconds} ${year}-${month}-${day}`;
  } catch (err) {
    return dateStr; // في حالة الخطأ، نعيد التاريخ الأصلي
  }
}

/* عند تغيير الطور أو الدائرة - تحديث سلوك اسم المؤسسة والقوائم */
function onLevelOrDaairaChange() {
  const level = document.getElementById("levelField").value;
  const daaira = document.getElementById("daairaField").value;
  const area = document.getElementById("institutionArea");
  const codeField = document.getElementById("institutionCodeField");

  area.innerHTML = '';
  codeField.style.display = 'none';
  codeField.value = '';

  if (!level || !daaira) return;

  const insts = window.institutionsByDaaira[daaira] || { "متوسط": [], "ثانوي": [] };

  if (level === 'ابتدائي') {
    // ✅ الآن: لا نضع "مؤسسة المأمن"، بل نضع placeholder فقط
    area.innerHTML = `
      <input type="text" id="instNamePrimary" placeholder="اختر المتوسطة التابعة لها الابتدائية (المأمن)" readonly>
      <select id="linkedMiddleSelect">
      <option value="">-- اختر المتوسطة التابعة لها الابتدائية --</option>
      </select>
       <div style="font-size:12px;color:#444;margin-bottom:8px;">سيظهر رمز المؤسسة عند الإختيار:</div> 
    `;
    const linked = document.getElementById("linkedMiddleSelect");
    (insts["متوسط"] || []).forEach(i => {
      const opt = document.createElement("option");
      opt.value = i.code;
      opt.text = `${i.name} — ${i.code}`;
      linked.add(opt);
    });
    linked.addEventListener('change', (e) => {
      const codeField = document.getElementById("institutionCodeField");
      const instNamePrimary = document.getElementById("instNamePrimary");
      if (e.target.value) {
        const selectedOption = e.target.options[e.target.selectedIndex].text.split(' — ')[0];
        instNamePrimary.value = selectedOption; // ✅ اسم المتوسطة التابعة
        codeField.style.display = '';
        codeField.value = e.target.value;       // ✅ رمز المتوسطة
      } else {
        instNamePrimary.value = '';
        codeField.style.display = 'none';
        codeField.value = '';
      }
    });

  } else if (level === 'متوسط' || level === 'ثانوي') {
    const list = insts[level] || [];
    area.innerHTML = `<select id="instSelect"><option value="">-- اختر ${level} --</option></select>`;
    const select = document.getElementById("instSelect");
    list.forEach(i => {
      const opt = document.createElement("option");
      opt.value = i.code;
      opt.text = `${i.name} — ${i.code}`;
      select.add(opt);
    });
    select.addEventListener('change', (e) => {
      const codeField = document.getElementById("institutionCodeField");
      if (e.target.value) {
        codeField.style.display = '';
        codeField.value = e.target.value;
      } else {
        codeField.style.display = 'none';
        codeField.value = '';
      }
    });
  }
}

/* تنسيق رقم الهاتف على شكل 00 00 00 00 00 */
function formatPhoneSimple(input) {
  // إزالة كل شيء ما عدا الأرقام
  let value = input.value.replace(/\D/g, '');
  
  // تحديد إلى 10 أرقام
  value = value.slice(0, 10);
  
  // تنسيق على شكل 00 00 00 00 00
  if (value.length > 0) {
    let formatted = '';
    for (let i = 0; i < value.length; i++) {
      if (i > 0 && i % 2 === 0) {
        formatted += ' ';
      }
      formatted += value[i];
    }
    input.value = formatted;
  } else {
    input.value = '';
  }
}

/* تنسيق رقم الهاتف الثابت على شكل 000 00 00 00 (9 أرقام) */
function formatFixedPhone(input) {
  // إزالة كل شيء ما عدا الأرقام
  let value = input.value.replace(/\D/g, '');
  
  // تحديد إلى 9 أرقام
  value = value.slice(0, 9);
  
  // تنسيق على شكل 000 00 00 00
  if (value.length > 0) {
    let formatted = '';
    // أول 3 أرقام
    if (value.length >= 3) {
      formatted = value.slice(0, 3);
      if (value.length > 3) {
        formatted += ' ' + value.slice(3, 5);
        if (value.length > 5) {
          formatted += ' ' + value.slice(5, 7);
          if (value.length > 7) {
            formatted += ' ' + value.slice(7, 9);
          }
        }
      }
    } else {
      formatted = value;
    }
    input.value = formatted;
  } else {
    input.value = '';
  }
}

/* دالة لتنسيق رقم الهاتف من رقم عادي إلى تنسيق 00 00 00 00 00 */
function formatPhoneNumber(phone) {
  if (!phone) return '';
  // إزالة علامة الاقتباس في البداية إن وجدت (من Google Sheets)
  let phoneStr = String(phone).replace(/^'/, '');
  // إزالة كل شيء ما عدا الأرقام والمسافات
  let value = phoneStr.replace(/[^\d\s]/g, '');
  // إزالة المسافات ثم إعادة التنسيق
  value = value.replace(/\s/g, '');
  // تحديد إلى 10 أرقام
  value = value.slice(0, 10);
  // تنسيق على شكل 00 00 00 00 00
  if (value.length === 10) {
    return value.slice(0, 2) + ' ' + value.slice(2, 4) + ' ' + 
           value.slice(4, 6) + ' ' + value.slice(6, 8) + ' ' + value.slice(8, 10);
  } else if (value.length > 0) {
    // إذا كان الرقم أقل من 10 أرقام، ننسقه كما هو
    let formatted = '';
    for (let i = 0; i < value.length; i++) {
      if (i > 0 && i % 2 === 0) {
        formatted += ' ';
      }
      formatted += value[i];
    }
    return formatted;
  }
  return '';
}

/* دالة لتنسيق رقم الهاتف الثابت من رقم عادي إلى تنسيق 000 00 00 00 */
function formatFixedPhoneNumber(phone) {
  if (!phone) return '';
  // إزالة علامة الاقتباس في البداية إن وجدت (من Google Sheets)
  let phoneStr = String(phone).replace(/^'/, '');
  // إزالة كل شيء ما عدا الأرقام والمسافات
  let value = phoneStr.replace(/[^\d\s]/g, '');
  // إزالة المسافات ثم إعادة التنسيق
  value = value.replace(/\s/g, '');
  // تحديد إلى 9 أرقام
  value = value.slice(0, 9);
  // تنسيق على شكل 000 00 00 00
  if (value.length === 9) {
    return value.slice(0, 3) + ' ' + value.slice(3, 5) + ' ' + 
           value.slice(5, 7) + ' ' + value.slice(7, 9);
  } else if (value.length > 0) {
    // إذا كان الرقم أقل من 9 أرقام، ننسقه تدريجياً
    let formatted = '';
    if (value.length >= 3) {
      formatted = value.slice(0, 3) + ' ';
      if (value.length >= 5) {
        formatted += value.slice(3, 5) + ' ';
        if (value.length >= 7) {
          formatted += value.slice(5, 7) + ' ';
          if (value.length >= 9) {
            formatted += value.slice(7, 9);
          } else {
            formatted += value.slice(7);
          }
        } else {
          formatted += value.slice(5);
        }
      } else {
        formatted += value.slice(3);
      }
    } else {
      formatted = value;
    }
    return formatted;
  }
  return '';
}       



/* تحقق من الإيميل */
function validateEmail(email) {
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return re.test(String(email).toLowerCase());
}

function validateGmail(input) {
  // إزالة المسافات
  input.value = input.value.replace(/\s/g, '');
  
  // منع الحروف العربية
  input.value = input.value.replace(/[\u0600-\u06FF]/g, '');
  
  // إجبار النص على حروف صغيرة
  input.value = input.value.toLowerCase();
  
  // السماح فقط بـ gmail
  if (!input.value.endsWith("@gmail.com") && input.value.length > 0) {
    input.setCustomValidity("يُسمح فقط بحسابات gmail");
  } else {
    input.setCustomValidity("");
  }
}

// دالة حذف التسجيل من Google Sheet
async function deleteRegistration(empId) {
  // طلب تأكيد من المستخدم قبل الحذف
  const confirmResult = await Swal.fire({
    title: "⚠️ تأكيد الحذف",
    text: "هل أنت متأكد من حذف هذا التسجيل؟ لا يمكن التراجع عن هذه العملية.",
    icon: "warning",
    showCancelButton: true,
    confirmButtonText: "نعم، احذف",
    cancelButtonText: "إلغاء",
    confirmButtonColor: "#dc3545",
    cancelButtonColor: "#6c757d"
  });

  if (!confirmResult.isConfirmed) {
    return; // المستخدم ألغى العملية
  }

  Swal.fire({ 
    title: 'جاري حذف التسجيل...', 
    allowOutsideClick: false, 
    didOpen: () => Swal.showLoading() 
  });

  try {
    const params = new URLSearchParams();
    params.append("action", "delete");
    params.append("empId", empId);

    const res = await fetch(scriptURL, {
      method: "POST",
      body: params
    });

    const data = await res.json();

    if (data.result === "success") {
      Swal.fire({
        title: "✅ تم الحذف بنجاح",
        text: "تم حذف التسجيل من قاعدة البيانات بنجاح",
        icon: "success",
        confirmButtonText: "حسنًا"
      }).then(() => {
        location.reload(); // إعادة تحميل الصفحة بعد الحذف
      });
    } else if (data.result === "not_found") {
      Swal.fire({
        title: "⚠️ لم يتم العثور على التسجيل",
        text: "التسجيل غير موجود في قاعدة البيانات",
        icon: "warning",
        confirmButtonText: "حسنًا"
      });
    } else {
      const errorMsg = data.message || data.error || "تعذر حذف التسجيل";
      Swal.fire({
        icon: "error",
        title: "❌ خطأ",
        text: errorMsg,
        confirmButtonText: "حسنًا"
      });
    }
  } catch (error) {
    console.error("Delete error:", error);
    Swal.fire({
      icon: "error",
      title: "❌ خطأ",
      text: "فشل الاتصال بخدمة الحذف: " + error.message,

    });
